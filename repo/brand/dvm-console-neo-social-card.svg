<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DVM Console NEO — Built for busy systems.</title>
  <desc id="desc">Social preview for the open-source DVM FNE operator console, featuring the routed-signal N mark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D141C"/>
      <stop offset="1" stop-color="#080C11"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#22303B" stroke-width="1" opacity="0.42"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="628" rx="22" fill="none" stroke="#2D4252" stroke-width="2"/>

  <g transform="translate(70 74) scale(.34)">
    <rect x="20" y="20" width="472" height="472" rx="112" fill="#0D1116"/>
    <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#354B5C" stroke-width="8"/>
    <path d="M136 372V140L376 372V140" fill="none" stroke="#22D3EE" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M136 218H84" fill="none" stroke="#2F81F7" stroke-width="28" stroke-linecap="round"/>
    <circle cx="72" cy="218" r="14" fill="#2F81F7"/>
    <path d="M376 294H428" fill="none" stroke="#35D07F" stroke-width="28" stroke-linecap="round"/>
    <circle cx="440" cy="294" r="14" fill="#35D07F"/>
  </g>

  <text x="280" y="108" fill="#91A4B5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5">DVM CONSOLE</text>
  <text x="270" y="240" fill="#22D3EE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="132" font-weight="800" letter-spacing="-7">NEO</text>
  <text x="72" y="360" fill="#EEF6FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-2">Built for busy systems.</text>
  <text x="74" y="418" fill="#B7C6D1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">Open-source DVM FNE operator console for macOS and Windows.</text>

  <g transform="translate(72 492)">
    <rect width="171" height="42" rx="7" fill="#14232E" stroke="#355267"/>
    <text x="85.5" y="27" fill="#EEF6FC" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">ONE WORKSPACE</text>
    <rect x="185" width="178" height="42" rx="7" fill="#14232E" stroke="#355267"/>
    <text x="274" y="27" fill="#EEF6FC" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">AGPL-3.0</text>
    <rect x="377" width="198" height="42" rx="7" fill="#14232E" stroke="#355267"/>
    <text x="476" y="27" fill="#EEF6FC" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">NO ANALYTICS</text>
  </g>
  <text x="72" y="584" fill="#788C9C" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Amateur and educational use · not for public- or life-safety operation</text>
</svg>
