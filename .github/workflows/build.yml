name: Build and package

on:
  push:
    branches:
      - neo
    tags:
      - "v*"
  pull_request:
    branches:
      - neo

permissions:
  contents: read

jobs:
  test-and-publish:
    name: ${{ matrix.os }} / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel
            rid: osx-x64
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            rid: win-x64
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Check out source and fnecore
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_target }}

      - name: Resolve package version
        shell: bash
        run: |
          source_version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' src/Directory.Build.props)"
          if [[ -z "$source_version" ]]; then
            printf 'VersionPrefix was not found in src/Directory.Build.props.\n' >&2
            exit 1
          fi
          plist_short_version="$(sed -n '/<key>CFBundleShortVersionString<\/key>/{n;s:.*<string>\(.*\)</string>.*:\1:p;q;}' packaging/macos/Info.plist)"
          plist_bundle_version="$(sed -n '/<key>CFBundleVersion<\/key>/{n;s:.*<string>\(.*\)</string>.*:\1:p;q;}' packaging/macos/Info.plist)"
          if [[ "$plist_short_version" != "$source_version" || "$plist_bundle_version" != "$source_version" ]]; then
            printf 'Info.plist versions (%s, %s) do not match source version %s.\n' \
              "$plist_short_version" "$plist_bundle_version" "$source_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            package_version="${GITHUB_REF_NAME#v}"
            if [[ "$package_version" != "$source_version" ]]; then
              printf 'Tag v%s does not match source version %s.\n' "$package_version" "$source_version" >&2
              exit 1
            fi
            printf 'DVM_RELEASE_VERSION=%s\n' "$package_version" >> "$GITHUB_ENV"
          else
            package_version="${source_version}-${GITHUB_SHA::7}"
          fi
          printf 'DVM_PACKAGE_VERSION=%s\n' "$package_version" >> "$GITHUB_ENV"

      - name: Verify native digital voice
        shell: bash
        run: |
          cargo fmt --manifest-path native/vocoder/Cargo.toml -- --check
          cargo clippy --manifest-path native/vocoder/Cargo.toml --locked --all-targets --target "${{ matrix.rust_target }}" -- -D warnings
          cargo test --manifest-path native/vocoder/Cargo.toml --locked --target "${{ matrix.rust_target }}"

      - name: Restore solution
        shell: bash
        run: dotnet restore dvmconsole.sln --ignore-failed-sources -p:NuGetAudit=false --verbosity minimal

      - name: Run solution tests
        shell: bash
        run: dotnet test dvmconsole.sln --no-restore --configuration Release -p:UseSharedCompilation=false --logger "trx;LogFileName=${{ matrix.rid }}.trx"

      # The Windows hosted runner has an interactive desktop session, which is
      # required to exercise Avalonia window creation (rather than only loading
      # the view models on a headless runner). The app exits 0/10 itself; teeing
      # the transcript preserves Avalonia diagnostics on either outcome.
      - name: Smoke Avalonia windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "avalonia-window-smoke.log"
          & dotnet run --project src/DvmConsole.Desktop/DvmConsole.Desktop.csproj --no-restore --configuration Release -- --smoke-windows configs/codeplug.example.yml *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Avalonia window smoke failed with exit code $LASTEXITCODE." }

      - name: Upload Avalonia smoke diagnostics
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: avalonia-window-smoke-${{ matrix.rid }}
          path: ${{ runner.temp }}/avalonia-window-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish unsigned desktop output
        shell: bash
        env:
          CONFIGURATION: Release
        run: scripts/publish-desktop.sh "${{ matrix.rid }}" "$RUNNER_TEMP/dvmconsole-publish/${{ matrix.rid }}"

      - name: Verify published output
        shell: bash
        run: scripts/verify-publish.sh "${{ matrix.rid }}" "$RUNNER_TEMP/dvmconsole-publish/${{ matrix.rid }}"

      - name: Package unsigned macOS handoff
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: scripts/package-desktop.sh "${{ matrix.rid }}" "$RUNNER_TEMP/dvmconsole-publish/${{ matrix.rid }}" "$RUNNER_TEMP/dvmconsole-publish/dvmconsole-${DVM_PACKAGE_VERSION}-${{ matrix.rid }}.zip"

      - name: Package unsigned Windows handoff
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: .\scripts\package-desktop.ps1 -PublishDirectory "$env:RUNNER_TEMP\dvmconsole-publish\${{ matrix.rid }}" -OutputArchive "$env:RUNNER_TEMP\dvmconsole-publish\dvmconsole-$($env:DVM_PACKAGE_VERSION)-${{ matrix.rid }}.zip"

      - name: Upload unsigned publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: dvmconsole-${{ matrix.rid }}
          path: ${{ runner.temp }}/dvmconsole-publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned package artifact
        uses: actions/upload-artifact@v7
        with:
          name: dvmconsole-package-${{ matrix.rid }}
          path: ${{ runner.temp }}/dvmconsole-publish/dvmconsole-${{ env.DVM_PACKAGE_VERSION }}-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: ${{ github.workspace }}/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v7

      - name: Download verified release packages
        uses: actions/download-artifact@v8
        with:
          pattern: dvmconsole-package-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          release_version="${GITHUB_REF_NAME#v}"
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_file" ]]; then
            printf 'Release notes are required for %s: %s\n' "$GITHUB_REF_NAME" "$notes_file" >&2
            exit 1
          fi

          packages=(release-artifacts/*.zip)
          if (( ${#packages[@]} != 3 )); then
            printf 'Expected three release packages, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi

          expected_packages=(
            "release-artifacts/dvmconsole-${release_version}-osx-arm64.zip"
            "release-artifacts/dvmconsole-${release_version}-osx-x64.zip"
            "release-artifacts/dvmconsole-${release_version}-win-x64.zip"
          )
          for package in "${expected_packages[@]}"; do
            if [[ ! -f "$package" ]]; then
              printf 'Expected release package is missing: %s\n' "$package" >&2
              exit 1
            fi
          done

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${expected_packages[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "DVM Console ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" "${expected_packages[@]}" \
              --title "DVM Console ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file" \
              --verify-tag
          fi
