name: Avalonia rebuild

on:
  push:
    branches:
      - avalonia_v2
    tags:
      - "v*"
  pull_request:
    branches:
      - avalonia_v2

permissions:
  contents: read

jobs:
  test-and-publish:
    name: ${{ matrix.os }} / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64

    steps:
      - name: Check out source and fnecore
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve package version
        shell: bash
        run: |
          source_version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' src/Directory.Build.props)"
          if [[ -z "$source_version" ]]; then
            printf 'VersionPrefix was not found in src/Directory.Build.props.\n' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            package_version="${GITHUB_REF_NAME#v}"
            if [[ "$package_version" != "$source_version" ]]; then
              printf 'Tag v%s does not match source version %s.\n' "$package_version" "$source_version" >&2
              exit 1
            fi
            printf 'DVM_RELEASE_VERSION=%s\n' "$package_version" >> "$GITHUB_ENV"
          else
            package_version="${source_version}-${GITHUB_SHA::7}"
          fi
          printf 'DVM_PACKAGE_VERSION=%s\n' "$package_version" >> "$GITHUB_ENV"

      - name: Check out pinned dvmvocoder source
        uses: actions/checkout@v4
        with:
          repository: DVMProject/dvmvocoder
          ref: 80ec5b66c0cfeff7b3f9ea9e1a8249f2b3ac3767
          path: .native/dvmvocoder

      - name: Build native software vocoder
        shell: pwsh
        run: |
          $buildDirectory = Join-Path $env:RUNNER_TEMP "dvmvocoder-build"
          if ("${{ matrix.rid }}" -eq "osx-arm64") {
            cmake -S .native/dvmvocoder -B $buildDirectory -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
            $library = Join-Path $buildDirectory "libvocoder.dylib"
          } else {
            cmake -S .native/dvmvocoder -B $buildDirectory -A x64
            $library = Join-Path $buildDirectory "Release/libvocoder.dll"
          }
          if ($LASTEXITCODE -ne 0) { throw "dvmvocoder configure failed with exit code $LASTEXITCODE." }
          cmake --build $buildDirectory --config Release
          if ($LASTEXITCODE -ne 0) { throw "dvmvocoder build failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path -LiteralPath $library -PathType Leaf)) { throw "Native vocoder output was not found at $library." }
          "DVMVOCODER_LIBRARY=$library" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore rebuild solution
        shell: bash
        run: dotnet restore src/DvmConsole.Rebuild.sln --ignore-failed-sources -p:NuGetAudit=false --verbosity minimal

      - name: Run rebuild solution tests
        shell: bash
        run: dotnet test src/DvmConsole.Rebuild.sln --no-restore --configuration Release -p:UseSharedCompilation=false --logger "trx;LogFileName=${{ matrix.rid }}.trx"

      - name: Publish unsigned desktop output
        shell: bash
        env:
          CONFIGURATION: Release
        run: scripts/publish-desktop.sh "${{ matrix.rid }}" "$RUNNER_TEMP/dvmconsole-publish/${{ matrix.rid }}"

      - name: Verify published output
        shell: bash
        run: scripts/verify-publish.sh "${{ matrix.rid }}" "$RUNNER_TEMP/dvmconsole-publish/${{ matrix.rid }}"

      - name: Package unsigned macOS handoff
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: scripts/package-desktop.sh "${{ matrix.rid }}" "$RUNNER_TEMP/dvmconsole-publish/${{ matrix.rid }}" "$RUNNER_TEMP/dvmconsole-publish/dvmconsole-${DVM_PACKAGE_VERSION}-${{ matrix.rid }}.zip"

      - name: Package unsigned Windows handoff
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: .\scripts\package-desktop.ps1 -PublishDirectory "$env:RUNNER_TEMP\dvmconsole-publish\${{ matrix.rid }}" -OutputArchive "$env:RUNNER_TEMP\dvmconsole-publish\dvmconsole-$($env:DVM_PACKAGE_VERSION)-${{ matrix.rid }}.zip"

      - name: Upload unsigned publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvmconsole-${{ matrix.rid }}
          path: ${{ runner.temp }}/dvmconsole-publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvmconsole-package-${{ matrix.rid }}
          path: ${{ runner.temp }}/dvmconsole-publish/dvmconsole-${{ env.DVM_PACKAGE_VERSION }}-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.rid }}
          path: ${{ github.workspace }}/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download verified release packages
        uses: actions/download-artifact@v4
        with:
          pattern: dvmconsole-package-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          packages=(release-artifacts/*.zip)
          if (( ${#packages[@]} != 2 )); then
            printf 'Expected two release packages, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
              --title "DVM Console ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file" \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
              --title "DVM Console ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
