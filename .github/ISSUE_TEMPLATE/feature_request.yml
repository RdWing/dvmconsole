name: Feature or workflow proposal
description: Propose an improvement to DVM Console NEO and its operator workflow.
title: "[Proposal] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Start with the operator or contributor problem, not a predetermined implementation. Preserve information density, compatibility, privacy, and the project's non-public-safety scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who encounters the problem, in what workflow, and what is difficult today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without requiring a specific implementation.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Connection or FNE traffic
        - Receive audio or call state
        - Transmit or PTT
        - Patching or multi-select
        - TAR, History, or playback
        - Audio device or processing
        - Settings or codeplug loading
        - User interface or accessibility
        - Packaging or release engineering
        - Documentation or contributor experience
        - Other
    validations:
      required: true

  - type: textarea
    id: current_workaround
    attributes:
      label: Current workaround
      description: How is the problem handled now, if at all?

  - type: textarea
    id: proposed_direction
    attributes:
      label: Proposed direction
      description: Optional implementation or design ideas, including alternatives considered.

  - type: textarea
    id: density_accessibility
    attributes:
      label: Information-density and accessibility impact
      description: Explain how the proposal preserves displayed information while affecting keyboard use, scaling, contrast, screen readers, or cognitive load.

  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility surfaces considered
      description: Check every surface that may be affected; leave unrelated items unchecked.
      options:
        - label: Settings paths or schema
        - label: Codeplug fields or examples
        - label: FNE framing or protocol behavior
        - label: Native ABI or package contents
        - label: Executable, bundle, application-data, or package identity
        - label: Existing operator workflow or XAML bindings

  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: Identify source tests, package targets, live integration, or hardware exercise that would establish success. It is acceptable to mark unavailable tiers not run.

  - type: checkboxes
    id: scope
    attributes:
      label: Project scope acknowledgement
      options:
        - label: This proposal does not present DVM Console NEO as suitable for public- or life-safety operation.
          required: true
        - label: Any examples or attachments use fictional or privacy-reviewed data.
          required: true
